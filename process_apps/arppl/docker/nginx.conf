events {}

http {
  upstream arppl_backend {
    server arppl-backend:8000;
  }

  upstream arppl_frontend {
    server arppl-frontend:80;
  }

  server {
    listen 80;
    server_name _;

    # Public app API for the standalone React UI. The backend container remains
    # private on the Docker network; callers can only enter through this gateway.
    location /api/process-a/ {
      proxy_pass http://arppl_backend/app/v1/process-a/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 256m;
    }

    # Stateless headless API for workflow orchestration, e.g.
    # POST /api/process-a/workflow/run -> /workflow/v1/process-a/run
    location /api/process-a/workflow/ {
      proxy_pass http://arppl_backend/workflow/v1/process-a/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 256m;
    }

    location /health {
      proxy_pass http://arppl_backend/health;
    }

    location / {
      proxy_pass http://arppl_frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
