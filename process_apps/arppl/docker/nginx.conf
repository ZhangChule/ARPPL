events {}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    set $arppl_backend arppl-backend:8000;
    set $arppl_frontend arppl-frontend:80;

    # Public app API for the standalone React UI. The backend container remains
    # private on the Docker network; callers can only enter through this gateway.
    location /api/process-a/ {
      rewrite ^/api/process-a/(.*)$ /app/v1/process-a/$1 break;
      proxy_pass http://$arppl_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 256m;
    }

    # Stateless headless API for workflow orchestration, e.g.
    # POST /api/process-a/workflow/run -> /workflow/v1/process-a/run
    location /api/process-a/workflow/ {
      rewrite ^/api/process-a/workflow/(.*)$ /workflow/v1/process-a/$1 break;
      proxy_pass http://$arppl_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 256m;
    }

    location /health {
      proxy_pass http://$arppl_backend/health;
    }

    location / {
      proxy_pass http://$arppl_frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
