name: arppl_process_app

services:
  arppl-backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: arppl-process-backend:latest
    restart: unless-stopped
    user: "0:0"
    environment:
      ARPPL_RECORD_ROOT: /var/lib/arppl/records
    expose:
      - "8000"
    volumes:
      # App API records are runtime artifacts. Remove this volume if the service
      # should be fully ephemeral in a workflow-only deployment.
      # The second mount keeps compatibility with already-built images whose
      # backend code still writes to /app/backend/records.
      - arppl-records:/var/lib/arppl/records
      - arppl-records:/app/backend/records
    networks:
      - arppl-internal

  arppl-frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE: /api/process-a
    image: arppl-process-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - arppl-internal

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - arppl-backend
      - arppl-frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - arppl-internal

networks:
  arppl-internal:
    driver: bridge

volumes:
  arppl-records:
